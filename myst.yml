version: 1
project:
  title: My Research Project
  authors:
    - name: Jane Doe
      affiliation: University of Somewhere
  bibliography:
    - references.bib
  # Maths macros from the eman-style-math standard ("Maths notation" in
  # AGENTS.md). Regenerate with its scripts/emit_macros.py myst.
  math:
    '\vect': '\mathbf{#1}'
    '\mat': '\mathbf{#1}'
    '\gvect': '\boldsymbol{#1}'
    '\gmat': '\boldsymbol{#1}'
    '\op': '\mathrm{#1}'
  toc:
    - file: docs/index
    - title: Notes
      children:
        - file: docs/notes/background
        - file: docs/notes/methods
    - title: Tutorials
      children:
        - file: docs/tutorials/getting_started
    - title: API Reference
      children:
        - file: docs/api/reference
        - file: docs/api/capabilities
site:
  template: book-theme
  title: My Research Project
