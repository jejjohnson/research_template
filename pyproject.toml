[project]
name = "my-research-project"
version = "0.1.2"
description = "A scientific research project template"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myproject"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["notebooks/", "marimo_notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
# Docstrings and comments carry Unicode maths (eman-style-math, "Maths
# notation" in AGENTS.md), so the maths glyphs that look like ASCII are allowed.
allowed-confusables = ["−", "×", "∗", "∣", "α", "γ", "ι", "ν", "ο", "ρ", "σ", "υ"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["E501", "I001", "B018"]
"marimo_notebooks/**/*.py" = ["E501", "I001", "B018"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-parameter-default = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/myproject --cov-report=term-missing --cov-report=xml:coverage.xml"
filterwarnings = ["error", "ignore::DeprecationWarning"]
xfail_strict = true

[tool.coverage.run]
source = ["src/myproject"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true


# ---------------------------------------------------------------------------
# pixi: the one environment manager and task runner (was pixi.toml + Makefile).
#   pixi install                 # the default environment (dev tools)
#   pixi task list               # every task with its description
#   pixi run <task>              # e.g. pixi run check; -e docs for the docs tasks
# pixi.lock is the lockfile of record: `pixi lock` after changing anything here.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
# Hydra 1.3 does not run on Python 3.14 (argparse rejects its help strings).
python = ">=3.12,<3.14"
numpy = "*"
scipy = "*"
xarray = "*"
netcdf4 = "*"
matplotlib = "*"
dvc = ">=3"
hydra-core = ">=1.3"

[tool.pixi.pypi-dependencies]
my-research-project = { path = ".", editable = true }
hydra-zen = ">=0.13"
omegaconf = ">=2.3"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
pre-commit = ">=3.7"
ruff = ">=0.9"
jupytext = ">=1.16"

[tool.pixi.feature.dev.pypi-dependencies]
ty = ">=0.0.1a6"

[tool.pixi.feature.docs.dependencies]
nodejs = ">=18"

[tool.pixi.feature.docs.pypi-dependencies]
mystmd = "*"

[tool.pixi.feature.jupyterlab.dependencies]
jupyterlab = ">=4"
ipykernel = ">=6.29"
jupyterlab-git = "*"
jupyterlab-lsp = "*"
jupyter-lsp = "*"
python-lsp-server = "*"
jupyterlab-myst = "*"
ipywidgets = ">=8"
nbdime = "*"

[tool.pixi.feature.jupyterlab.pypi-dependencies]
jupyterlab-code-formatter = "*"
jupyterlab-spellchecker = "*"

[tool.pixi.feature.marimo.dependencies]
marimo = "*"
duckdb = ">=1"
altair = ">=5"
polars = ">=1"
pyarrow = "*"
anywidget = "*"

[tool.pixi.feature.marimo.pypi-dependencies]
vegafusion = { version = ">=2", extras = ["embed"] }
plotly = ">=5"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
jupyterlab = { features = ["dev", "jupyterlab"], solve-group = "default" }
marimo = { features = ["dev", "marimo"], solve-group = "default" }

# --- Developer loop ----------------------------------------------------------

[tool.pixi.tasks]
install-hooks = { cmd = "pre-commit install", description = "Install the git pre-commit hooks" }
init = { cmd = "python -c \"import pathlib, shutil; p = pathlib.Path('.env'); print('.env already exists, skipping') if p.exists() else (shutil.copy('.env.example', p), print('.env created from .env.example'))\"", description = "Bootstrap .env from .env.example (skip if .env already exists)" }
test = { cmd = "pytest -v", description = "Run the tests with the coverage report (what CI runs)" }
test-fast = { cmd = "pytest -v -o addopts=", description = "Run the tests without coverage" }
lint = { cmd = "ruff check .", description = "Lint with ruff, entire repo (what CI runs)" }
format = { cmd = "ruff format . && ruff check --fix .", description = "Format with ruff and apply auto-fixes" }
format-check = { cmd = "ruff format --check .", description = "Check formatting without changing files" }
typecheck = { cmd = "ty check src/", description = "Type-check the package with ty (what CI runs)" }
check = { depends-on = ["lint", "format-check", "typecheck", "test"], description = "lint, format-check, typecheck and test in one go" }
precommit = { cmd = "pre-commit run --all-files", description = "Run every pre-commit hook on every file" }
capabilities = { cmd = "python scripts/capabilities.py", description = "Regenerate docs/api/capabilities.md (every public name, for reuse)" }
notebooks-to-ipynb = { cmd = "python scripts/convert_notebooks.py --verbose", description = "Convert notebooks/*.py to .ipynb (local only, never committed)" }

# --- Experiments --------------------------------------------------------------

preprocess = { cmd = "python scripts/preprocess.py", description = "Run the preprocess entry point (Hydra overrides allowed)" }
train = { cmd = "python scripts/train.py", description = "Train with Hydra configs (e.g. pixi run train model=transformer)" }
train-zen = { cmd = "python scripts/train_zen.py", description = "Train with the hydra-zen configs" }
evaluate = { cmd = "python scripts/evaluate.py", description = "Evaluate the trained model" }

# --- GitHub housekeeping ------------------------------------------------------

gh-labels = { cmd = "bash .github/scripts/create-labels.sh", description = "Bootstrap the GitHub label taxonomy (idempotent)" }
gh-sub = { cmd = "bash .github/scripts/link-issues.sh sub {{ parent }} {{ children }}", args = ["parent", "children"], description = "Link children as sub-issues of a parent: pixi run gh-sub 7 \"42 43 44\"" }
gh-block = { cmd = "bash .github/scripts/link-issues.sh block {{ issue }} {{ blocked_by }}", args = ["issue", "blocked_by"], description = "Mark an issue as blocked by another: pixi run gh-block 44 43" }
gh-show = { cmd = "bash .github/scripts/link-issues.sh show {{ issue }}", args = ["issue"], description = "Show parent / sub-issues / blocking / blocked-by for an issue" }

# --- Docs and notebooks environments -------------------------------------------

[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "myst build --html", description = "Build the docs into _build/html (what pages.yml runs)" }
docs-serve = { cmd = "myst start", description = "Serve the docs with live preview" }

[tool.pixi.feature.jupyterlab.tasks]
lab = { cmd = "jupyter lab", description = "Start JupyterLab" }

[tool.pixi.feature.marimo.tasks]
marimo-edit = { cmd = "marimo edit", description = "Open marimo" }
